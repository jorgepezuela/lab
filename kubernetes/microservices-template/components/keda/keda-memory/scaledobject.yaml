---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: memory-scaledobject
  labels:
    app.kubernetes.io/name: microservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: microservice
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

