---
apiVersion: keda.sh/v1alpha1
kindo: ScaledObject
metadata:
  name: cpu-scaledobject
  labels:
    app.kubernetes.io/name: microservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: microservice
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "90"

